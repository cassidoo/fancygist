<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Prevent flash of wrong theme
			(function () {
				try {
					var stored = JSON.parse(localStorage.getItem("fancygist-theme") || "{}");
					var pref = (stored.state && stored.state.preference) || "system";
					var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					if (dark) document.documentElement.classList.add("dark");
					document.documentElement.style.colorScheme = dark ? "dark" : "light";
				} catch (e) {}
			})();
		</script>

		<meta property="og:image" content="/og.png" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="FancyGist" />
		<meta
			name="twitter:description"
			content="A beautiful Markdown editor for GitHub Gists."
		/>
		<meta name="twitter:image" content="/og.png" />
		<meta name="twitter:creator" content="@cassidoo" />

		<title>FancyGist</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
